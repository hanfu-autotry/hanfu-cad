<g font-family="sans-serif" fill="#1a1a1a">
  <text x="460.0" y="1478.0" font-size="44" font-weight="600">试验竖领浅交襟 · 第 1 步 · 解析构造 P₁ / P₂</text>
  <text x="460.0" y="1528.0" font-size="26" fill="#8a8a8a">底＝hanfu-cad 厂商基准男 M（模板原衣长 770）「02 前片 ×2」只读　｜　净版 mm　｜　专注前片</text>
  <text x="460.0" y="1578.0" font-size="27">P₁ = V + a·(−1,0)，a∈[0,285]；P₂ = V + b·u，u=(135,−770)/781.74，b∈[0,781.74]</text>
  <text x="460.0" y="1618.0" font-size="27">a、b 暂不给具体位置（待定）；空心点为示意占位，非定量、不是从截图量出</text>
  <text x="460.0" y="1658.0" font-size="27">衣长：缩短 5cm 已撤销，回归厂商基准模板原值 L=770；θ=atan(135/770)=9.9443°，∠V=99.9443°</text>
  <text x="460.0" y="1698.0" font-size="27">布纹仍为模板硬编码 9.3°，与门襟边不平行（叉积 0.0112）；模板既有后果，未自行修正</text>
</g>
