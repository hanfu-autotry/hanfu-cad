<text x="24.000" y="470.000" font-family="sans-serif" font-size="3.90" fill="#6a6a6a" text-anchor="start" font-weight="400">产物＝一条带状领子，由三部分组成：段①前片左襟 → 段②后片 → 段③前片右襟，沿共边 P₁A / P₁′A′ 首尾相接。</text>
<text x="24.000" y="483.000" font-family="sans-serif" font-size="3.90" fill="#6a6a6a" text-anchor="start" font-weight="400">领条首尾不接：两端 P₂B / P₂′B′（绿粗线，各 30mm）分开落在带子两端，不再绕成环、不再自交。</text>
<text x="24.000" y="496.000" font-family="sans-serif" font-size="3.90" fill="#6a6a6a" text-anchor="start" font-weight="400">展开为刚性铰接（反射等距）：边长 / 角度 / 面积全部不变，无拉伸、无近似；前 / 后片 cmds 与模板逐项相同。</text>
