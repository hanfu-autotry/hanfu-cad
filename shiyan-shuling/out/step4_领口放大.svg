<text x="56.0" y="102.0" font-family="sans-serif" font-size="21" fill="#6f6f6f" text-anchor="start">蓝＝领子上缘直线折线 B→A→A′→B′ + 四条 30mm 宽度边；红＝第 3 步新领口 60° 圆弧（下缘，不重复描）</text>
<text x="56.0" y="134.0" font-family="sans-serif" font-size="21" fill="#6f6f6f" text-anchor="start">红弧：圆心角 60° ⇒ R=弦长=76.5732mm、圆心 (21.968, 796.155)、凹向下摆；左片圆心镜像、两段在中缝 y≈722.80 相交</text>
<text x="56.0" y="166.0" font-family="sans-serif" font-size="21" fill="#6f6f6f" text-anchor="start">11:48 修正：P₁P₂ 改 60° 弧、A 依然右上角、上领缘采用直线；A/A′ 竖起在顶边之上 29.55mm</text>
