<g font-family="sans-serif" fill="#1a1a1a">
  <text x="460.0" y="1478.0" font-size="44" font-weight="600">试验竖领浅交襟 · 第 3 步 · P₁P₂ 新领口（圆心角 60° 圆弧）</text>
  <text x="460.0" y="1528.0" font-size="26" fill="#8a8a8a">底＝hanfu-cad 厂商基准男 M（模板原衣长 770）「前片左右镜像同步 ×2 + 后片半 ×2」只读　｜　净版 mm</text>
  <text x="460.0" y="1578.0" font-size="27">P₁P₂ = 新领口（用户 2026-11-11 11:48 令：圆心角 60° 的弧）；端点 P₁/P₂ 不动、弦长不变 ⇒ R = 弦长 = 76.5732mm</text>
  <text x="460.0" y="1618.0" font-size="27">右片弧 P₁(-50.00,770.00)→P₂(8.63,720.75)：弦 76.57 / 弧长 80.19 / 矢高 10.26 mm；圆心 (21.968, 796.155)、扫角 60°</text>
  <text x="460.0" y="1658.0" font-size="27">左片圆心 = 右片关于 x=0 镜像，两段不共圆、在中缝 y≈722.80 相交；V→P₁ / V→P₂ 及镜像旧边仍是虚线标注</text>
  <text x="460.0" y="1698.0" font-size="27">平铺：外轮廓＝后片整片（后片半 ×2 镜像），中央 V 形＝前片门襟边；正面线稿、不填色、不做背视</text>
</g>
