  <text x="170.0" y="2742.0" font-size="30" fill="#6f6f6f">平铺 2000（通袖）× 高 770（衣长）｜ 袖 500 长 × 袖口 277 高 ｜ 侧缝 y 0…493，接袖缝 y 493…770</text>
</g>
