<g font-family="sans-serif" fill="#1a1a1a">
  <text x="170.0" y="96" font-size="52" font-weight="600">四块布 · V1B（衣身长 825 ／ 接袖长 313）</text>
  <text x="170.0" y="152" font-size="30" fill="#6f6f6f">幅宽 500 不动 · 内侧块 ×2 经向 ＝ 2×衣身长 · 外侧块 ×2 经向 ＝ 2×接袖长 · 四块共用同一条折线 · 沿中缝对称 · 通袖 2000</text>
  <text x="170.0" y="200" font-size="30" fill="#6f6f6f">现用：衣身长 825（中缝长）／接袖长 313（袖根 ＝ 衣身长 − 腋点，袖底正落腋点）｜基准与 ../hanfu-zhidui 同一套</text>
</g>
<g font-family="sans-serif" font-size="28" fill="#1a4d8f">
  <text x="170.0" y="2410.0">┄ 拼幅缝：中缝 x=0（通高）、内外缝 x=±500（只在外侧块那一段）</text>
</g>
<g font-family="sans-serif" font-size="28" fill="#b85400">
  <text x="170.0" y="2458.0">┈ 对折线（肩线）y=825：四块共用一条，外侧块骑在两侧、两头各短 512（短在袖口一头）</text>
</g>
<g font-family="sans-serif" font-size="28" fill="#b3241c">
  <text x="170.0" y="2506.0">— 前中剪开：颈侧点 (±80, 825) → 下摆中点 (0, 0)，两道</text>
</g>
<g font-family="sans-serif" font-size="28" fill="#6f6f6f">
  <text x="170.0" y="2554.0">— 细灰：内侧块布边（外侧块没盖到的上下两段）→ 折后就是侧缝段 y 0…512</text>
</g>
