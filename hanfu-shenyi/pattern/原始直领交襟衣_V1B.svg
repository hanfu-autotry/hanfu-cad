  <text x="170.0" y="2972.0" font-size="30" fill="#6f6f6f">平铺 2000（通袖）× 高 825（衣长）｜ 袖 500 长 × 袖口 313 高 ｜ 侧缝 y 0…512，接袖缝 y 512…825</text>
</g>
