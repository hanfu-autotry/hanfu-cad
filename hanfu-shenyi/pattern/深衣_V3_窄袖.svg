<g font-family="sans-serif" font-size="30" fill="#1a1a1a">
  <text x="150.0" y="1475.0" fill="#1a4d8f">┄ 拼幅缝（通高 4 匹＝通袖 2000；x=0 那条兼作背中缝/中缝）</text>
  <text x="150.0" y="1519.0" fill="#6a2c91">┄ 段的分界＝腰线（衣身接缝）：上衣段在上、裳段在下</text>
  <text x="150.0" y="1563.0" fill="#b85400">┈ 对折线（上衣段正中；折后即肩线，衣长 195）</text>
  <text x="150.0" y="1607.0" fill="#b3241c">— 开领线（两道弦：颈侧点 ±80 → 下摆中点，贯通到摆；间距 160 只在颈口）</text>
  <text x="150.0" y="1651.0" fill="#1d6b3a">┈ 领条内缘（平行于襟缘弦、内让 30；颈口处露出后片 100）</text>
  <text x="150.0" y="1695.0" fill="#1d6b3a">— 躯干衣身边缘（竖段）：自腰线往上 62，另一端即腋点（与裳无关）</text>
  <text x="150.0" y="1739.0" fill="#1d6b3a">— 袖底缝（腰线 ±430 以外到袖口，前后片缝合）：与竖段在腋点共顶点 → 不加＝敞口(侧视倒U)，加了＝闭成 0</text>
</g>
