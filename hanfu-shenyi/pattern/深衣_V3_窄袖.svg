<title>深衣 · 裁片与制作（V3 窄袖）</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="sans-serif" fill="#1a1a1a">
  <text x="150.0" y="100.0" font-size="52" font-weight="600">深衣 · ① 材料与 ② 制作（V3 窄袖 · 衣长＝袖口 195 · 总长 770）</text>
  <text x="150.0" y="158.0" font-size="32" fill="#6f6f6f">上衣段 4 幅·水平对折＝上衣（衣长 195 ＝ 袖口宽）｜裳段 4 幅·左右折＝下裳（裳高 575，两侧折、中缝缝合）· 前中剪开 160 · 上领条</text>
  <text x="150.0" y="210.0" font-size="30" fill="#6f6f6f">通袖 2000 ＝ 4 幅 × 500 ｜ 总料长 965 ＝ 上衣段 390（2×衣长）+ 裳段 575 ｜ 腰线（衣身接缝）＝ 两段交界 = 齐胸高腰 ｜ 腋点 ±370</text>
</g>
