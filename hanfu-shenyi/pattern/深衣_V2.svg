  <text x="150.0" y="5646.0" font-size="30" fill="#6f6f6f">袖带高 624（＝衣长）｜裳高 1248｜腰线即衣身接缝｜前中 | 领条 30 | 后片 100（后中缝居中）| 领条 30 | 弦止于腰线中点 O｜裳前中缝＝衣身前中缝（只不缝合）｜裳本体 6 幅 × 1248｜领条宽＝立起高＝30</text>
</g>
