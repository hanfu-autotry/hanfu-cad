<g font-family="sans-serif" fill="#111111">
<text x="60" y="70" font-size="42" font-weight="600">古制 · 整衣铺开一片（V2宽袖）｜ 一条连续外轮廓：裳段 + 上衣段（水平对折）</text>
<text x="60" y="130" font-size="27" fill="#444444">通袖 2000 ＝ 4 幅 × 500 ｜ 布片高 2496 ＝ 上衣段 1248（水平对折＝上衣，衣长 624＝袖口）＋ 裳段 1248</text>
<text x="60" y="174" font-size="27" fill="#444444">裳段：一条 6 幅 × 1248 的带子，左右折 —— 两侧（±500）折、两端在中缝（x=0）缝合</text>
<text x="60" y="218" font-size="27" fill="#444444">前中开口 160：自肩线（折线）剪到腰线；裳段不开衩（中缝缝合），穿着时整衣套头</text>
<text x="60" y="262" font-size="27" fill="#444444">领条压边可见 30（中间露出后片 100）；领条另裁 3907 × 30，直条绕颈后</text>
<text x="60" y="306" font-size="27" fill="#444444">外轮廓各段角色：裳摆=自由边 ｜ 裳两侧=折线（不缝） ｜ 腰线(±1000)=衣裳接缝 ｜ ±1000=袖口(自由) ｜ ±80=前中剪开 ｜ 肩线=折线</text>
<text x="60" y="350" font-size="27" fill="#444444">衣身底边 ±370 以内＝衣身摆线（接收褶的裳：裳腰 3000 收褶接 740，比≈2.7:1，推算）；幅缝 ±500 到袖口 ±1000＝袖底缝（与镜像缝合，沿外幅整条）；本图不画褶线</text>
<text x="60" y="394" font-size="27" fill="#444444">净版未含缝份 ｜ 单位 mm ｜ 裳段与上衣段同宽（4 幅），腰线处**无台阶**（2026-11-18 改）</text>
<text x="2550" y="2972" font-size="28">领条 ×1（另裁）</text>
</g>
