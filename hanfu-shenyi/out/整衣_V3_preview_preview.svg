<g font-family="sans-serif" fill="#111111">
<text x="60" y="70" font-size="42" font-weight="600">通裁 · 整衣铺开一片（V3窄袖）｜ 一条连续外轮廓：裳后 + 衣(中段对折) + 裳前</text>
<text x="60" y="130" font-size="27" fill="#444444">通袖 2000 ＝ 4 幅 × 500 ｜ 布片高 1540 ＝ 中段 390（对折＝上衣，衣长 195＝袖口）＋ 裳 575 × 2</text>
<text x="60" y="174" font-size="27" fill="#444444">裳·前 / 裳·后：另一块布（同料），各 2 幅宽，缝于腰线（衣身接缝）→ 缝合成深衣</text>
<text x="60" y="218" font-size="27" fill="#444444">前中开口 160 贯通到摆：两襟独立可滑（左右衣襟活动）；交襟＝系出来的，几何里没有'交'</text>
<text x="60" y="262" font-size="27" fill="#444444">领条压边可见 40（中间露出后片 80）；领条另裁 1700 × 95，直条绕颈后</text>
<text x="60" y="306" font-size="27" fill="#444444">外轮廓各段角色：裳摆=自由边 ｜ 裳两侧=侧缝(与镜像缝合) ｜ 腰线台阶段(±500~1000)=袖底缝(与镜像缝合) ｜ ±1000=袖口(自由) ｜ ±80=前中剪开 ｜ 肩线=折线</text>
<text x="60" y="350" font-size="27" fill="#444444">衣裳分开：衣底边 ±370 以内＝衣身摆线（接收褶的裳：裳腰 1000 收褶接 740，比≈2:1，推算）；幅缝 ±500 到袖口 ±1000＝袖底缝（与镜像缝合，沿外幅整条）；本图不画褶线</text>
<text x="60" y="394" font-size="27" fill="#444444">净版未含缝份 ｜ 单位 mm ｜ 裳半宽 500 ＜ 布片半宽 1000 → 腰线处台阶（剪裁图实测上/下块各 2 幅）</text>
<text x="2550" y="1951" font-size="28">领条 ×1（另裁）</text>
</g>
