<text x="60" y="70" font-size="42" font-weight="600">通裁 · V1 原始直领交襟衣 · 整衣铺开一片</text>
<text x="60" y="130" font-size="27" fill="#444444">通袖 2000 ＝ 4 幅 × 500 ｜ 布片高 1248 ＝ 对折线 ×2（衣长 624 ＝ 肩线到下摆）</text>
<text x="60" y="174" font-size="27" fill="#444444">上下对折（肩线折出，不另裁前后片）→ 前中剪开两道（不折），领条压边</text>
<text x="60" y="218" font-size="27" fill="#444444">前中开口 160 贯通到下摆：两襟独立可滑（左右衣襟活动）；交襟＝系出来的，几何里没有'交'</text>
<text x="60" y="262" font-size="27" fill="#444444">领条压边可见 40（中间露出后片 80）；领条另裁 2000 × 95，直条绕颈后</text>
<text x="60" y="306" font-size="27" fill="#444444">袖底缝：幅缝 ±500 到袖口 ±1000（与镜像缝合，沿外幅整条）；幅缝 ±500＝拼幅缝</text>
<text x="60" y="350" font-size="27" fill="#444444">净版未含缝份 ｜ 单位 mm ｜ 本件无裳（上衣下裳另接）</text>
<text x="2550" y="1659" font-size="28">领条 ×1（另裁）</text>
