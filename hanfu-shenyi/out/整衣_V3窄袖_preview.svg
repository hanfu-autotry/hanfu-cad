<g font-family="sans-serif" fill="#111111">
<text x="60" y="70" font-size="42" font-weight="600">古制 · 整衣铺开一片（V3窄袖）｜ 一条连续外轮廓：裳段 + 上衣段（水平对折）</text>
<text x="60" y="130" font-size="27" fill="#444444">通袖 2000 ＝ 4 幅 × 500 ｜ 布片高 965 ＝ 上衣段 390（水平对折＝上衣，衣长 195＝袖口）＋ 裳段 575</text>
<text x="60" y="174" font-size="27" fill="#444444">裳段：一条 4 幅 × 575 的带子，左右折 —— 两侧（±500）折、两端在中缝（x=0）缝合</text>
<text x="60" y="218" font-size="27" fill="#444444">前中开口 160：颈侧点 ±80 斜向汇聚到下摆（V2 止腰线 / V3 贯通到摆）；裳段不开衩（中缝缝合），穿着时整衣套头</text>
<text x="60" y="262" font-size="27" fill="#444444">领条压边可见 30（中间露出后片 100）；领条另裁 1708 × 30，直条绕颈后</text>
<text x="60" y="306" font-size="27" fill="#444444">外轮廓各段角色：裳摆=自由边 ｜ 裳两侧=折线（不缝） ｜ 腰线(±1000)=衣裳接缝 ｜ ±1000=袖口(自由) ｜ ±80=前中剪开 ｜ 肩线=折线</text>
<text x="60" y="350" font-size="27" fill="#444444">衣身底边 ±370 以内＝衣身摆线（接收褶的裳：裳腰 2000 收褶接 740，比≈2.7:1，推算）；幅缝 ±500 到袖口 ±1000＝袖底缝（与镜像缝合，沿外幅整条）；本图不画褶线</text>
<text x="60" y="394" font-size="27" fill="#444444">净版未含缝份 ｜ 单位 mm ｜ 上衣 4 幅 / 下裳 4 幅；裳与上衣同宽，腰线无台阶（V3）</text>
<text x="2550" y="1441" font-size="28">领条 ×1（另裁）</text>
</g>
<text x="60" y="1635" font-size="24" fill="#8a8a8a">预览：CUT 黑 / 拼缝·腰线·袖底 蓝虚 / 折线·压边 橙点划 / 剪开 红 / 领条 绿 / 布纹 灰</text>
