<text x="744.9" y="354.0" font-family="sans-serif" font-size="26" fill="#b85400" text-anchor="start">对折线（┈ 橙）：肩线是折出来的，不另裁前后片</text>
<text x="744.9" y="402.0" font-family="sans-serif" font-size="26" fill="#c0392b" text-anchor="start">剪开线（— 红）：两道，从对折线剪到下摆中点，不折、靠领条压住毛边</text>
<text x="744.9" y="450.0" font-family="sans-serif" font-size="26" fill="#1e7a4a" text-anchor="start">领条内缘（┈ 绿）：∥ 襟缘弦、内让一个带宽 30</text>
<text x="1015.8" y="2004.0" font-family="sans-serif" font-size="30" fill="#1a1a1a" text-anchor="start">④ 领条 ×1 ｜ 1418.2 × 30 ｜ 一条直的，成型后呈倒 U：左襟 → 绕颈 → 右襟</text>
<text x="1724.9" y="2260.0" font-family="sans-serif" font-size="26" fill="#1f5fa8" text-anchor="middle">领条长 1418.2</text>
<text x="2604.0" y="2139.0" font-family="sans-serif" font-size="26" fill="#1f5fa8" text-anchor="start">宽 30</text>
<text x="724.9" y="2384.0" font-family="sans-serif" font-size="26" fill="#9aa0a6" text-anchor="start">单位 mm｜净版｜x = 0 前中缝，y = 0 下摆，y 向上｜平面布片，未折、未缝</text>
