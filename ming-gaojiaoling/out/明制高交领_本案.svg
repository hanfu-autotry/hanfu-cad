  <text x="460.0" y="4047.7" font-size="27">续衽（中缝左边）×1：左缘＝HH1（∥原外缘，H 在上边缘离 P2′ 20），上缘 H→P1′，右缘＝中缝；灰细线＝被裁掉的原外缘与下摆</text>
  <text x="460.0" y="4087.7" font-size="27">领缘条（高交领·全衣一条）×1：长方形，长＝2×(L 弧−续衽 H 移动量)＋后领段；宽＝AA′＝PB＝97.1（B 重合）</text>
  <text x="460.0" y="4127.7" font-size="27">接袖、三角拼接、系带、下摆绢衬条已删除；本版共 6 片</text>
</g>
