<g font-family="sans-serif" fill="#1a1a1a">
  <text x="460.0" y="3799.7" font-size="44" font-weight="600">明制高交领 · 裁片图 · 本案</text>
  <text x="460.0" y="3849.7" font-size="26" fill="#8a8a8a">底片＝jiexiu 模板后片　｜　净版　mm　｜　女装</text>
  <text x="460.0" y="3899.7" font-size="27">前片（中缝右边）×1：左缘＝中缝（x=0 实线）；上缘＝领口线 L 弧（P1→P 145.7）；领口宽 65 ／ 深 130；肩/袖/侧缝/摆沿用模板</text>
  <text x="460.0" y="3939.7" font-size="27">后片（半·模板原样）×2：jiexiu 原样复制</text>
  <text x="460.0" y="3979.7" font-size="27">续衽（中缝左边）×1：右缘＝中缝；上缘＝L′（领条外缘弧 A′→X 331.6 ＋ 水平段 X→P1′ 108.3，由领条缘派生）；左缘＝HH1（A′→H1 516.4，∥原外缘，H 在 l′ 定位弧上离 P2′ 20）；灰细线＝被裁掉的原外缘与下摆</text>
  <text x="460.0" y="4019.7" font-size="27">领缘条（高交领·全衣一条）×1：长方形，长＝2×(P0→P 的 L 弧)＋后领段；宽＝AA′＝PB＝86.7（B 落在中缝）。只由 L 与领条宽决定</text>
  <text x="460.0" y="4059.7" font-size="27">接袖、三角拼接、系带、下摆绢衬条已删除；本版共 6 片</text>
</g>
